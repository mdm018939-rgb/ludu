<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>M Ludo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        background-color: #071330;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #error-display {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(20, 0, 0, 0.95);
        color: #ff5555;
        padding: 20px;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
        z-index: 999999;
        overflow: auto;
      }
    </style>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errDiv = document.getElementById('error-display');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText += '\n[GLOBAL ERROR] ' + msg + '\nAt: ' + url + ':' + lineNo + ':' + columnNo + '\n' + (error && error.stack ? error.stack : '');
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.getElementById('error-display');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText += '\n[UNHANDLED REJECTION] ' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown reason');
        }
      });
    </script>
  </head>
  <body>
    <div id="error-display"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
